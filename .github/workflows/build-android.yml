# Fabrication de l'appli Toppop Run pour Google Play (v2)
name: Fabriquer l'appli Android

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["twa-manifest.json", ".github/workflows/build-android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les outils Android (SDK déjà présent sur la machine GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | sort -V | tail -1)
          echo "cmdline-tools: $CT"
          # Bubblewrap cherche sdkmanager dans <sdk>/bin
          [ -e "$ANDROID_HOME/bin" ] || sudo ln -s "$CT/bin" "$ANDROID_HOME/bin"
          yes | "$CT/bin/sdkmanager" --licenses > /dev/null || true
          "$CT/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" "platform-tools"
          ls "$ANDROID_HOME/build-tools"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Le secret KEYSTORE_PASSWORD manque"; exit 1; fi
          PW=$(printf "%s" "$KEYSTORE_PASSWORD" | tr -d '[:space:]-' | tr 'a-z' 'A-Z')
          echo "::add-mask::$PW"
          echo "Longueur du mot de passe : ${#PW} caractères (attendu : 20)"
          if printf "%s" "$PW" | grep -qE '^[A-Z0-9]{20}$'; then echo "Format du mot de passe : OK (20 lettres/chiffres)"; else echo "Format du mot de passe : PAS BON (il contient autre chose que des lettres et chiffres, par ex. des deux-points)"; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in toppop-run.keystore.enc -out toppop-run.keystore -pass "pass:$PW" || { echo "Mot de passe incorrect"; exit 1; }
          keytool -list -keystore toppop-run.keystore -storepass "$PW" -alias toppoprun > /dev/null && echo "Clé et mot de passe OK"
          echo "PW_CLEAN=$PW" >> "$GITHUB_ENV"

      - name: Générer le projet Android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Fabriquer et signer l'appli
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PW_CLEAN }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PW_CLEAN }}
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Préparer assetlinks.json
        run: bubblewrap fingerprint generateAssetLinks --manifest=./twa-manifest.json --output=./assetlinks.json || true

      - name: Mettre les fichiers à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: toppop-run-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            assetlinks.json
          if-no-files-found: error
