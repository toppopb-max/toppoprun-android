name: Fabriquer l'appli Android

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["twa-manifest.json", ".github/workflows/build-android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.1.0" "platforms;android-36" "platform-tools"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Le secret KEYSTORE_BASE64 manque"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > toppop-run.keystore

      - name: Générer le projet Android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Fabriquer et signer l'appli
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Préparer assetlinks.json
        run: bubblewrap fingerprint generateAssetLinks --manifest=./twa-manifest.json --output=./assetlinks.json || true

      - name: Mettre les fichiers à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: toppop-run-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            assetlinks.json
          if-no-files-found: error
