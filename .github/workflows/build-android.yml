# Fabrication de l'appli Toppop Run pour Google Play
name: Fabriquer l'appli Android

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["twa-manifest.json", ".github/workflows/build-android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les outils Android (SDK déjà présent sur la machine GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | sort -V | tail -1)
          echo "cmdline-tools: $CT"
          # Bubblewrap cherche sdkmanager dans <sdk>/bin
          [ -e "$ANDROID_HOME/bin" ] || sudo ln -s "$CT/bin" "$ANDROID_HOME/bin"
          yes | "$CT/bin/sdkmanager" --licenses > /dev/null || true
          "$CT/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" "platform-tools"
          ls "$ANDROID_HOME/build-tools"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Le secret KEYSTORE_BASE64 manque"; exit 1; fi
          CLEAN=$(printf "%s" "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "Longueur de la clé collée : ${#CLEAN} caractères (attendu : 3584)"
          printf "%s" "$CLEAN" | base64 -d > toppop-run.keystore
          keytool -list -keystore toppop-run.keystore -storepass "$KEYSTORE_PASSWORD" -alias toppoprun > /dev/null && echo "Clé et mot de passe OK"

      - name: Générer le projet Android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Fabriquer et signer l'appli
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Préparer assetlinks.json
        run: bubblewrap fingerprint generateAssetLinks --manifest=./twa-manifest.json --output=./assetlinks.json || true

      - name: Mettre les fichiers à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: toppop-run-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            assetlinks.json
          if-no-files-found: error
